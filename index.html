<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Options Allocation Optimizer (ILP)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f8fafc;
      margin-bottom: 24px;
    }

    /* ── Top controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .field-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: nowrap;
    }

    input[type="number"], input[type="text"] {
      background: #1e2330;
      border: 1px solid #2d3548;
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 0.9rem;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #4f8ef7;
    }
    input[type="number"] { width: 140px; }
    input[type="text"]   { width: 90px; }

    /* ── Mode toggle ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #2d3548;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #94a3b8;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .slider { background: #1e3a5f; }
    .toggle input:checked + .slider::before {
      transform: translateX(20px);
      background: #4f8ef7;
    }
    .toggle-label-active { color: #4f8ef7; font-weight: 600; }

    /* ── Accounts section ── */
    .accounts-section {
      margin-bottom: 24px;
      background: #181d2a;
      border: 1px solid #2d3548;
      border-radius: 10px;
      padding: 14px 18px;
    }
    .accounts-section h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #4a5568;
      margin-bottom: 10px;
    }
    .accounts-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .accounts-row input[type="text"] { width: 120px; }
    .accounts-row input[type="number"] { width: 130px; }
    .accounts-row .pos-hint {
      font-size: 0.75rem;
      color: #64748b;
      white-space: nowrap;
    }
    .accounts-row .btn-remove-acct {
      background: none;
      border: none;
      color: #4a5568;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .accounts-row .btn-remove-acct:hover { color: #f56565; }
    .btn-add-acct {
      background: #1e3a5f;
      color: #4f8ef7;
      border: 1px solid #2a4a75;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-add-acct:hover { opacity: 0.85; }

    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #2d3548;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr {
      background: #181d2a;
    }

    th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      white-space: nowrap;
      border-bottom: 1px solid #2d3548;
    }
    th.acct-group {
      text-align: center;
      color: #4f8ef7;
      border-left: 1px solid #2d3548;
      font-size: 0.72rem;
    }

    tbody tr {
      border-bottom: 1px solid #1e2330;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #181d2a; }

    td {
      padding: 6px 8px;
      vertical-align: middle;
    }

    td input[type="text"],
    td input[type="number"] {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px 6px;
      color: #f1f5f9;
      font-size: 0.875rem;
    }
    td input:focus {
      background: #1e2330;
      border-color: #4f8ef7;
    }

    td select {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: #f1f5f9;
      font-size: 0.875rem;
      padding: 4px 6px;
      cursor: pointer;
      outline: none;
      width: 100%;
    }
    td select:focus {
      background: #1e2330;
      border-color: #4f8ef7;
    }
    td select option { background: #1e2330; }

    .col-cost {
      color: #94a3b8;
      font-size: 0.82rem;
      white-space: nowrap;
      padding: 6px 14px;
    }
    .col-rec {
      background: #151b2e;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      color: #4f8ef7;
      min-width: 50px;
      padding: 6px 10px;
      border-left: 1px solid #2d3548;
    }
    .col-rec.empty { color: #2d3548; }

    .col-total {
      color: #94a3b8;
      font-size: 0.82rem;
      white-space: nowrap;
      padding: 6px 10px;
    }

    .col-pct {
      color: #94a3b8;
      font-size: 0.82rem;
      white-space: nowrap;
      padding: 6px 10px;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #4a5568;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-remove:hover { color: #f56565; }

    .row-actions {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 7px 16px;
      border: none;
      transition: opacity 0.15s, background 0.15s;
    }
    button:hover { opacity: 0.85; }

    .btn-add {
      background: #1e3a5f;
      color: #4f8ef7;
      border: 1px solid #2a4a75;
    }
    .btn-reset {
      background: #2d1f1f;
      color: #f56565;
      border: 1px solid #4a2828;
    }

    .solver-badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid;
    }
    .solver-badge.ilp  { color: #48bb78; border-color: #276749; background: #1a2e23; }
    .solver-badge.warn { color: #ecc94b; border-color: #6b5a1e; background: #2a2412; }

    /* ── Per-account summary cards ── */
    .summaries-wrap {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .summary {
      background: #181d2a;
      border: 1px solid #2d3548;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .summary-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4f8ef7;
      min-width: 80px;
    }
    .summary-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-stat .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #4a5568;
    }
    .summary-stat .stat-value {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .meter-wrap {
      flex: 1;
      min-width: 120px;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 4px;
    }
    .meter-track {
      height: 7px;
      background: #2d3548;
      border-radius: 7px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 0.3s ease, background 0.3s ease;
      width: 0%;
      background: #4f8ef7;
    }
    .meter-fill.good { background: #48bb78; }
    .meter-fill.okay { background: #ecc94b; }
    .meter-fill.low  { background: #f56565; }

    .alloc-pct {
      font-size: 1.3rem;
      font-weight: 800;
      transition: color 0.3s;
    }
    .alloc-pct.good { color: #48bb78; }
    .alloc-pct.okay { color: #ecc94b; }
    .alloc-pct.low  { color: #f56565; }
    .alloc-pct.none { color: #2d3548; }

    /* ── Funds needed section ── */
    .funds-needed {
      margin-top: 16px;
      background: #181d2a;
      border: 1px solid #2d3548;
      border-radius: 10px;
      padding: 16px 20px;
    }
    .funds-needed-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }
    .funds-needed-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #4a5568;
    }
    .funds-needed-amount {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ecc94b;
    }
    .funds-needed-sub {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 14px;
    }
    .funds-needed-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .funds-needed-table th {
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #4a5568;
      padding: 4px 10px 8px;
      border-bottom: 1px solid #2d3548;
    }
    .funds-needed-table td {
      padding: 6px 10px;
      color: #cbd5e0;
      border-bottom: 1px solid #1e2330;
    }
    .funds-needed-table tr:last-child td {
      border-bottom: none;
    }
    .change-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .change-badge.up   { background: #1a2e23; color: #48bb78; border: 1px solid #276749; }
    .change-badge.down { background: #2d1f1f; color: #f56565; border: 1px solid #4a2828; }
    .change-badge.same { background: #1e2330; color: #4a5568; border: 1px solid #2d3548; }

    .funds-acct-block { margin-bottom: 18px; }
    .funds-acct-block:last-child { margin-bottom: 0; }
    .funds-acct-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #4f8ef7;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<h1>Options Allocation Optimizer</h1>

<!-- ── Top controls ── -->
<div class="controls">
  <div class="toggle-wrap">
    <span id="mode-label-basic">Basic</span>
    <label class="toggle">
      <input type="checkbox" id="mode-toggle" checked />
      <span class="slider"></span>
    </label>
    <span id="mode-label-enhanced">Enhanced</span>
  </div>
  <span class="solver-badge ilp" id="solver-badge">ILP Exact</span>
</div>

<!-- ── Accounts ── -->
<div class="accounts-section">
  <h2>Accounts</h2>
  <div id="accounts-list"></div>
  <button class="btn-add-acct" id="btn-add-acct">+ Add Account</button>
</div>

<!-- ── Table ── -->
<div class="table-wrap">
  <table id="contracts-table">
    <thead id="table-head">
      <!-- dynamically generated -->
    </thead>
    <tbody id="table-body">
      <!-- rows injected by JS -->
    </tbody>
  </table>
</div>

<!-- ── Row actions ── -->
<div class="row-actions">
  <button class="btn-add" id="btn-add-row">+ Add 10 Rows</button>
  <button class="btn-reset" id="btn-reset">Reset</button>
</div>

<!-- ── Per-account summaries ── -->
<div class="summaries-wrap" id="summaries-wrap"></div>

<!-- ── Funds needed section ── -->
<div class="funds-needed" id="funds-needed-section" style="display:none">
  <div class="funds-needed-header">
    <span class="funds-needed-title">Funds to Reach Full Utilisation</span>
  </div>
  <div id="funds-needed-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/javascript-lp-solver@0.4.24/prod/solver.js"></script>
<script>
  // ── Optimizer logic ─────────────────────────────────────────
  const COMMISSION   = 0.65;
  const EXCHANGE_FEE = 0.01;
  const TOTAL_FEE    = COMMISSION + EXCHANGE_FEE;

  function computeCost(type, strike, premium, isEnhanced) {
    const s = parseFloat(strike)  || 0;
    const p = parseFloat(premium) || 0;
    const isPut = type === 'put';
    if (!isEnhanced) return isPut ? s * 100 : 0;
    return isPut
      ? (s * 100) - (p * 100) + TOTAL_FEE
      : -(p * 100) + TOTAL_FEE;
  }

  function optimize(rows, availableCash) {
    const solverBadge = document.getElementById('solver-badge');
    const counts = new Array(rows.length).fill(0);
    if (!availableCash || availableCash <= 0) return counts;

    const freeIdx = [];
    rows.forEach((r, i) => {
      if (r.cost <= 0) { counts[i] = 1; freeIdx.push(i); }
    });

    const activeIdx = rows
      .map((_, i) => i)
      .filter(i => !freeIdx.includes(i) && rows[i].cost > 0);

    if (activeIdx.length === 0) return counts;

    const freeCost = freeIdx.reduce((s, i) => s + rows[i].cost, 0);
    const budget   = availableCash - freeCost;
    if (budget <= 0) return counts;

    const minCost    = activeIdx.reduce((s, i) => s + rows[i].cost, 0);
    const enforceMin = minCost <= budget;

    if (typeof solver !== 'undefined') {
      try {
        solverBadge.textContent = 'ILP Exact';
        solverBadge.className   = 'solver-badge ilp';

        const ub  = activeIdx.map(i => Math.floor(budget / rows[i].cost));

        // Evenness tolerance: allow dollar allocations per ticker to differ
        // by at most the average cost across active positions. This forces
        // much tighter balance than the old maxCost approach while still
        // giving the solver room to fill odd gaps with integer contracts.
        // If the tight tolerance is infeasible, we progressively relax.
        const costs = activeIdx.map(i => rows[i].cost);
        const maxCost = Math.max(...costs);
        const avgCost = costs.reduce((a, b) => a + b, 0) / costs.length;
        const idealShare = budget / activeIdx.length;
        // Use the smaller of avgCost or 50% of the ideal equal share,
        // but floor at the max single contract cost × 0.25 to stay feasible
        const baseTolerance = Math.min(avgCost, idealShare * 0.5);
        let dollarTolerance = Math.max(baseTolerance, maxCost * 0.25);

        // Balance penalty: meaningful weight so the solver actively
        // minimises spread, not just as a tiebreaker.
        // Scaled relative to costs so it doesn't dominate the allocation objective.
        const EPS = 1 / (budget + 1);

        const model = {
          optimize: 'obj', opType: 'max',
          constraints: {}, variables: {}, ints: {}
        };

        model.constraints['budget'] = { max: budget };

        // maxD and minD are continuous variables tracking the largest and
        // smallest dollar allocation across tickers.
        // Penalize spread: obj -= EPS*maxD, obj += EPS*minD (minimise gap)
        model.variables['maxD'] = { obj: -EPS, budget: 0 };
        model.variables['minD'] = { obj:  EPS, budget: 0 };

        // Hard constraint: maxD - minD <= dollarTolerance
        model.constraints['dollarEven'] = { max: dollarTolerance };
        model.variables['maxD']['dollarEven'] = 1;
        model.variables['minD']['dollarEven'] = -1;

        activeIdx.forEach((rowIdx, j) => {
          const v = `x${j}`;
          const c = rows[rowIdx].cost;
          model.variables[v] = { obj: c, budget: c };
          model.ints[v] = 1;

          if (enforceMin) {
            const lbKey = `lb${j}`;
            model.constraints[lbKey] = { min: 1 };
            model.variables[v][lbKey] = 1;
          }

          const ubKey = `ub${j}`;
          model.constraints[ubKey] = { max: ub[j] };
          model.variables[v][ubKey] = 1;

          // maxD >= c * x_j  →  maxD - c*x_j >= 0
          const maxKey = `maxD_${j}`;
          model.constraints[maxKey] = { min: 0 };
          model.variables['maxD'][maxKey] = 1;
          model.variables[v][maxKey] = -c;

          // minD <= c * x_j  →  c*x_j - minD >= 0
          const minKey = `minD_${j}`;
          model.constraints[minKey] = { min: 0 };
          model.variables[v][minKey] = c;
          model.variables['minD'][minKey] = -1;
        });

        // Try with tight tolerance first; if infeasible, progressively relax
        const toleranceSteps = [dollarTolerance, maxCost * 0.5, maxCost * 0.75, maxCost, budget];
        for (const tol of toleranceSteps) {
          model.constraints['dollarEven'] = { max: tol };
          const result = solver.Solve(model);
          if (result.feasible) {
            activeIdx.forEach((rowIdx, j) => {
              counts[rowIdx] = Math.round(result[`x${j}`] || 0);
            });
            return counts;
          }
        }
      } catch (e) {
        console.warn('ILP solver error, falling back to greedy:', e);
      }
    }

    // ── Greedy fallback ────────────────────────────────────
    solverBadge.textContent = 'Greedy (fallback)';
    solverBadge.className   = 'solver-badge warn';

    if (enforceMin) activeIdx.forEach(i => { counts[i] = 1; });

    const eligible  = activeIdx.map(i => ({ idx: i, cost: rows[i].cost }));
    const totalCost = () => rows.reduce((sum, r, i) => sum + r.cost * counts[i], 0);
    const dollarAlloc = (idx) => rows[idx].cost * counts[idx];

    let changed = true;
    while (changed) {
      changed = false;
      const used       = totalCost();
      const remaining  = availableCash - used;
      const candidates = eligible.filter(r => r.cost <= remaining);
      if (candidates.length === 0) break;

      // Pick the candidate with the lowest dollar allocation (balance by $)
      const minDollar       = Math.min(...candidates.map(r => dollarAlloc(r.idx)));
      const evenCandidates  = candidates.filter(r => dollarAlloc(r.idx) === minDollar);

      let best = null, bestDelta = Infinity;
      for (const r of evenCandidates) {
        const delta = Math.abs(availableCash - (used + r.cost));
        if (delta < bestDelta) { bestDelta = delta; best = r; }
      }
      if (best) { counts[best.idx]++; changed = true; }
    }

    return counts;
  }

  // ── State ──────────────────────────────────────────────────
  let enhanced = true;
  let rowId = 0;
  let acctId = 0;
  let accounts = [];

  // ── DOM refs ───────────────────────────────────────────────
  const modeToggle   = document.getElementById('mode-toggle');
  const modeLabelB   = document.getElementById('mode-label-basic');
  const modeLabelE   = document.getElementById('mode-label-enhanced');
  const tableHead    = document.getElementById('table-head');
  const tableBody    = document.getElementById('table-body');
  const btnAddRow    = document.getElementById('btn-add-row');
  const btnReset     = document.getElementById('btn-reset');
  const accountsList = document.getElementById('accounts-list');
  const btnAddAcct   = document.getElementById('btn-add-acct');
  const summariesWrap = document.getElementById('summaries-wrap');
  const fundsSection  = document.getElementById('funds-needed-section');
  const fundsContent  = document.getElementById('funds-needed-content');

  // ── Account management ─────────────────────────────────────
  function addAccount(name = '', accountValue = '', cash = '') {
    const id = ++acctId;
    accounts.push({ id, name, accountValue: parseFloat(accountValue) || 0, cash: parseFloat(cash) || 0 });
    renderAccountRow(accounts[accounts.length - 1]);
    rebuildTableHeader();
    rebuildTableRowCells();
    recalculate();
  }

  function removeAccount(id) {
    accounts = accounts.filter(a => a.id !== id);
    const el = document.querySelector(`.accounts-row[data-acct-id="${id}"]`);
    if (el) el.remove();
    rebuildTableHeader();
    rebuildTableRowCells();
    recalculate();
  }

  function renderAccountRow(acct) {
    const div = document.createElement('div');
    div.className = 'accounts-row';
    div.dataset.acctId = acct.id;

    div.innerHTML = `
      <input type="text" class="acct-name" placeholder="Account name" value="${acct.name}" />
      <label style="font-size:0.75rem;color:#64748b">Value:</label>
      <input type="number" class="acct-value" min="0" step="100" placeholder="Account Value" value="${acct.accountValue || ''}" />
      <label style="font-size:0.75rem;color:#64748b">Available:</label>
      <input type="number" class="acct-cash" min="0" step="100" placeholder="Available for Trade" value="${acct.cash || ''}" />
      <span class="pos-hint" data-acct-id="${acct.id}">8–12%: —</span>
      <button class="btn-remove-acct" title="Remove account">✕</button>
    `;

    div.querySelector('.acct-name').addEventListener('input', e => {
      acct.name = e.target.value.trim();
      rebuildTableHeader();
      recalculate();
    });

    div.querySelector('.acct-value').addEventListener('input', e => {
      acct.accountValue = parseFloat(e.target.value) || 0;
      recalculate();
    });

    div.querySelector('.acct-cash').addEventListener('input', e => {
      acct.cash = parseFloat(e.target.value) || 0;
      recalculate();
    });

    div.querySelector('.btn-remove-acct').addEventListener('click', () => {
      removeAccount(acct.id);
    });

    accountsList.appendChild(div);
  }

  // ── Dynamic table header ───────────────────────────────────
  function rebuildTableHeader() {
    let html = '<tr>';
    html += '<th>Ticker</th><th>Type</th><th>Strike ($)</th><th>Premium ($)</th><th>Cost / Contract</th>';
    accounts.forEach(acct => {
      const name = acct.name || `Acct ${acct.id}`;
      html += `<th class="acct-group">${name}<br>Contracts</th>`;
      html += `<th class="acct-group">${name}<br>Total</th>`;
      html += `<th class="acct-group">${name}<br>%</th>`;
    });
    html += '<th></th></tr>';
    tableHead.innerHTML = html;
  }

  // ── Rebuild per-account cells in existing rows ─────────────
  function rebuildTableRowCells() {
    tableBody.querySelectorAll('tr[data-id]').forEach(tr => {
      // Remove old account cells (everything after col-cost and before btn-remove)
      const costCell = tr.querySelector('.col-cost');
      const removeCell = tr.querySelector('.cell-remove');
      // Remove all cells after cost and before remove
      while (costCell.nextElementSibling && costCell.nextElementSibling !== removeCell) {
        costCell.nextElementSibling.remove();
      }
      // Insert per-account cells
      accounts.forEach(acct => {
        const recTd = document.createElement('td');
        recTd.className = `col-rec empty acct-rec-${acct.id}`;
        recTd.textContent = '—';

        const totalTd = document.createElement('td');
        totalTd.className = `col-total acct-total-${acct.id}`;
        totalTd.textContent = '—';

        const pctTd = document.createElement('td');
        pctTd.className = `col-pct acct-pct-${acct.id}`;
        pctTd.textContent = '—';

        tr.insertBefore(recTd, removeCell);
        tr.insertBefore(totalTd, removeCell);
        tr.insertBefore(pctTd, removeCell);
      });
    });
  }

  // ── Row factory ────────────────────────────────────────────
  function createRow(ticker = '', type = 'put', strike = '', premium = '') {
    const id = ++rowId;
    const tr = document.createElement('tr');
    tr.dataset.id = id;

    // Base cells
    let html = `
      <td><input class="inp-ticker" type="text" placeholder="AAPL" value="${ticker}" /></td>
      <td>
        <select class="inp-type">
          <option value="put"  ${type === 'put'  ? 'selected' : ''}>Put</option>
          <option value="call" ${type === 'call' ? 'selected' : ''}>Call</option>
        </select>
      </td>
      <td><input class="inp-strike"  type="number" min="0" step="0.5"  placeholder="150" value="${strike}" /></td>
      <td><input class="inp-premium" type="number" min="0" step="0.01" placeholder="1.50" value="${premium}" /></td>
      <td class="col-cost">—</td>`;

    // Per-account cells
    accounts.forEach(acct => {
      html += `<td class="col-rec empty acct-rec-${acct.id}">—</td>`;
      html += `<td class="col-total acct-total-${acct.id}">—</td>`;
      html += `<td class="col-pct acct-pct-${acct.id}">—</td>`;
    });

    html += `<td class="cell-remove"><button class="btn-remove" title="Remove row">✕</button></td>`;
    tr.innerHTML = html;

    tr.querySelectorAll('input, select').forEach(el =>
      el.addEventListener('input', recalculate)
    );
    tr.querySelector('.btn-remove').addEventListener('click', () => {
      tr.remove();
      recalculate();
    });

    return tr;
  }

  function addRow(ticker, type, strike, premium) {
    tableBody.appendChild(createRow(ticker, type, strike, premium));
  }

  // ── Recalculate ────────────────────────────────────────────
  function recalculate() {
    const rows = [];

    tableBody.querySelectorAll('tr[data-id]').forEach(tr => {
      const ticker  = tr.querySelector('.inp-ticker').value.trim();
      const type    = tr.querySelector('.inp-type').value;
      const strike  = parseFloat(tr.querySelector('.inp-strike').value)  || 0;
      const premium = parseFloat(tr.querySelector('.inp-premium').value) || 0;
      const cost    = computeCost(type, strike, premium, enhanced);
      rows.push({ ticker, type, strike, premium, cost, tr });
    });

    // Update Cost/Contract cells
    rows.forEach(r => {
      const cell = r.tr.querySelector('.col-cost');
      if (r.strike === 0) {
        cell.textContent = '—';
      } else if (r.cost === 0 && !enhanced) {
        cell.textContent = r.type === 'call' ? '—' : '$0';
      } else {
        const sign = r.cost < 0 ? '-$' : '$';
        cell.textContent = sign + Math.abs(r.cost).toLocaleString('en-US', {
          minimumFractionDigits: 2, maximumFractionDigits: 2
        });
      }
    });

    const activeRows = rows.filter(r => r.strike > 0);

    // Run optimizer per account
    const results = accounts.map(acct => {
      const counts = optimize(activeRows, acct.cash);
      const totalUsed = activeRows.reduce((sum, r, i) => sum + r.cost * counts[i], 0);
      const totalPremium = activeRows.reduce((sum, r, i) => sum + r.premium * 100 * counts[i], 0);
      return { acct, counts, totalUsed, totalPremium };
    });

    // Update per-account cells in each row
    rows.forEach(r => {
      accounts.forEach((acct, ai) => {
        const recCell   = r.tr.querySelector(`.acct-rec-${acct.id}`);
        const totalCell = r.tr.querySelector(`.acct-total-${acct.id}`);
        const pctCell   = r.tr.querySelector(`.acct-pct-${acct.id}`);
        if (!recCell) return; // safety

        const idx = activeRows.indexOf(r);
        const count = (idx >= 0) ? results[ai].counts[idx] : 0;

        if (count > 0) {
          recCell.textContent = count;
          recCell.classList.remove('empty');
          const rowTotal = r.cost * count;
          totalCell.textContent = '$' + rowTotal.toLocaleString('en-US', {
            minimumFractionDigits: 2, maximumFractionDigits: 2
          });
          pctCell.textContent = acct.accountValue > 0
            ? (rowTotal / acct.accountValue * 100).toFixed(1) + '%' : '—';
        } else {
          recCell.textContent = '—';
          recCell.classList.add('empty');
          totalCell.textContent = '—';
          pctCell.textContent = '—';
        }
      });
    });

    // Update position size hints per account (uses accountValue)
    accounts.forEach(acct => {
      const hint = document.querySelector(`.pos-hint[data-acct-id="${acct.id}"]`);
      if (hint) {
        if (acct.accountValue > 0) {
          const fmt = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
          hint.textContent = `8–12%: ${fmt(acct.accountValue * 0.08)} – ${fmt(acct.accountValue * 0.12)}`;
        } else {
          hint.textContent = '8–12%: —';
        }
      }
    });

    // Render per-account summaries
    renderSummaries(results);

    // Render funds-needed per account
    renderFundsNeeded(activeRows, results);
  }

  // ── Render per-account summaries ───────────────────────────
  function renderSummaries(results) {
    summariesWrap.innerHTML = '';
    results.forEach(({ acct, totalUsed, totalPremium }) => {
      const cash = acct.cash;
      const pct = cash > 0 ? (totalUsed / cash) * 100 : 0;
      const remaining = cash - totalUsed;
      const grade = pct >= 95 ? 'good' : pct >= 80 ? 'okay' : 'low';
      const name = acct.name || `Account ${acct.id}`;

      const div = document.createElement('div');
      div.className = 'summary';
      div.innerHTML = `
        <span class="summary-name">${name}</span>
        <div class="summary-stat">
          <span class="stat-label">Allocated</span>
          <span class="stat-value">${cash > 0 ? '$' + totalUsed.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$—'}</span>
        </div>
        <div class="summary-stat">
          <span class="stat-label">Remaining</span>
          <span class="stat-value">${cash > 0 ? '$' + remaining.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$—'}</span>
        </div>
        <div class="summary-stat">
          <span class="stat-label">Premium</span>
          <span class="stat-value">${cash > 0 ? '$' + totalPremium.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$—'}</span>
        </div>
        <div class="summary-stat">
          <span class="stat-label">Premium %</span>
          <span class="stat-value">${cash > 0 && totalUsed > 0 ? (totalPremium / totalUsed * 100).toFixed(2) + '%' : '—'}</span>
        </div>
        <span class="alloc-pct ${cash > 0 ? grade : 'none'}">${cash > 0 ? pct.toFixed(1) + '%' : '—%'}</span>
        <div class="meter-wrap">
          <div class="meter-label"><span>0%</span><span>100%</span></div>
          <div class="meter-track">
            <div class="meter-fill ${cash > 0 ? grade : ''}" style="width:${cash > 0 ? Math.min(pct, 100) : 0}%"></div>
          </div>
        </div>
      `;
      summariesWrap.appendChild(div);
    });
  }

  // ── Funds needed — per account ─────────────────────────────
  function renderFundsNeeded(activeRows, results) {
    fundsContent.innerHTML = '';
    let anyShown = false;

    results.forEach(({ acct, counts, totalUsed }) => {
      const cash = acct.cash;
      if (activeRows.length === 0 || cash <= 0) return;

      const payingRows = activeRows.filter(r => r.cost > 0);
      if (payingRows.length === 0) return;

      const currentPct    = totalUsed / cash;
      const maxSingleCost = Math.max(...payingRows.map(r => r.cost));
      const searchCeil    = Math.min(maxSingleCost + 1, 50000);
      const minCost       = Math.min(...payingRows.map(r => r.cost));

      // Generate candidates
      const candidateSet = new Set();
      for (const r of payingRows) {
        const c = r.cost;
        const kMin = Math.floor(cash / c) + 1;
        const kMax = Math.ceil((cash + searchCeil) / c);
        for (let k = kMin; k <= kMax; k++) {
          const x = Math.ceil((k * c - cash) * 100) / 100;
          if (x > 0 && x <= searchCeil) candidateSet.add(x);
        }
      }
      const denseCeil = Math.min(minCost, 1000);
      for (let x = 1; x <= denseCeil; x++) candidateSet.add(x);

      let bestX = null, bestPct = currentPct, bestCounts = null, bestNewUsed = 0;
      const candidates = Array.from(candidateSet).sort((a, b) => a - b);

      for (const x of candidates) {
        const trialCash      = cash + x;
        const trialCounts    = optimize(activeRows, trialCash);
        const trialUsed      = activeRows.reduce((s, r, i) => s + r.cost * trialCounts[i], 0);
        const trialPct       = trialUsed / trialCash;
        const trialRemaining = trialCash - trialUsed;

        if (trialPct > currentPct + 1e-9 && trialRemaining < minCost - 1e-6) {
          bestX = x; bestPct = trialPct; bestCounts = trialCounts; bestNewUsed = trialUsed;
          break;
        }
        if (trialPct > bestPct + 1e-9) {
          bestPct = trialPct; bestX = x; bestCounts = trialCounts; bestNewUsed = trialUsed;
        }
      }

      const name = acct.name || `Account ${acct.id}`;
      const block = document.createElement('div');
      block.className = 'funds-acct-block';

      if (bestX === null) {
        block.innerHTML = `
          <div class="funds-acct-name">${name}</div>
          <div class="funds-needed-header">
            <span class="funds-needed-amount" style="color:#48bb78">Already optimal</span>
          </div>
          <p class="funds-needed-sub">No addition within one contract's cost improves utilisation.</p>
        `;
      } else {
        const fmtNeeded = bestX.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const finalCash  = cash + bestX;
        const finalTotal = bestCounts.reduce((s, c) => s + c, 0);
        const newPct     = ((bestNewUsed / finalCash) * 100).toFixed(1);

        let tableHtml = `<table class="funds-needed-table"><thead><tr>
          <th>Ticker</th><th>Type</th><th>Now → New</th><th>Change</th>
        </tr></thead><tbody>`;

        activeRows.forEach((r, i) => {
          const before = counts[i] || 0;
          const after  = bestCounts[i] || 0;
          if (before === 0 && after === 0) return;
          const delta = after - before;
          const badgeClass = delta > 0 ? 'up' : delta < 0 ? 'down' : 'same';
          const badgeText  = delta > 0 ? `+${delta}` : delta < 0 ? String(delta) : '—';
          const label = r.ticker || `Row ${i + 1}`;
          const typeLabel = r.type.charAt(0).toUpperCase() + r.type.slice(1);
          tableHtml += `<tr><td>${label}</td><td>${typeLabel}</td><td>${before} → ${after}</td><td><span class="change-badge ${badgeClass}">${badgeText}</span></td></tr>`;
        });
        tableHtml += '</tbody></table>';

        block.innerHTML = `
          <div class="funds-acct-name">${name}</div>
          <div class="funds-needed-header">
            <span class="funds-needed-amount">+$${fmtNeeded}</span>
          </div>
          <p class="funds-needed-sub">Adding $${fmtNeeded} gives ${finalTotal} contracts at ${newPct}% utilisation ($${bestNewUsed.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} of $${finalCash.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}).</p>
          ${tableHtml}
        `;
      }

      fundsContent.appendChild(block);
      anyShown = true;
    });

    fundsSection.style.display = anyShown ? 'block' : 'none';
  }

  // ── Mode toggle ────────────────────────────────────────────
  modeToggle.addEventListener('change', () => {
    enhanced = modeToggle.checked;
    modeLabelB.classList.toggle('toggle-label-active', !enhanced);
    modeLabelE.classList.toggle('toggle-label-active',  enhanced);
    recalculate();
  });

  // ── Buttons ────────────────────────────────────────────────
  btnAddRow.addEventListener('click', () => {
    for (let i = 0; i < 10; i++) addRow();
    recalculate();
  });

  btnReset.addEventListener('click', () => {
    tableBody.innerHTML = '';
    rowId = 0;
    for (let i = 0; i < 10; i++) addRow();
    recalculate();
  });

  btnAddAcct.addEventListener('click', () => {
    addAccount('', '', '');
  });

  // ── Init ───────────────────────────────────────────────────
  // Seed with 3 accounts
  addAccount('Account 1', '', '');
  addAccount('Account 2', '', '');
  addAccount('Account 3', '', '');

  // Seed with 10 empty rows
  for (let i = 0; i < 10; i++) addRow();
  recalculate();

  // Set initial mode label
  modeLabelE.classList.add('toggle-label-active');
</script>
</body>
</html>
